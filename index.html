    <script>
      // Proving uses every core only in a cross-origin-isolated page. Where the host does not send the headers for it,
      // a service worker adds them; the page reloads once under it.
      if (!window.crossOriginIsolated && window.isSecureContext && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('coi-sw.js').then(function (registration) {
          if (navigator.serviceWorker.controller || sessionStorage.getItem('coi-reloaded')) return;
          var reload = function () {
            sessionStorage.setItem('coi-reloaded', '1');
            location.reload();
          };
          var worker = registration.active ? null : registration.installing || registration.waiting;
          if (!worker) return reload();
          worker.addEventListener('statechange', function () {
            if (worker.state === 'activated') reload();
          });
        });
      }
    </script>
